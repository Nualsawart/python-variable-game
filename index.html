<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Variable Game</title>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

let handLandmarker, webcamRunning = false, lastFingerCount = -1;
const video = document.getElementById("webcam");
const result = document.getElementById("result");
const status = document.getElementById("status");

async function createHandLandmarker() {
  try {
    status.textContent = "กำลังเตรียมผู้ช่วยแมว Python...";
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });
    status.textContent = "พร้อมแล้ว! ยกนิ้ว 1–4 นิ้วได้เลย";
    document.getElementById("startCamera").disabled = false;
  } catch (e) {
    status.textContent = "โหลดระบบไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ";
    console.error(e);
  }
}

async function enableCamera() {
  if (!handLandmarker) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    video.srcObject = stream;
    webcamRunning = true;
    document.getElementById("startCamera").textContent = "กล้องกำลังทำงาน";
    status.textContent = "ลองยกนิ้ว 1–4 นิ้วให้กล้องดู";
    predictWebcam();
  } catch (e) {
    status.textContent = "กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์";
    console.error(e);
  }
}

function countFingers(l) {
  let count = 0;
  if (l[8].y < l[6].y) count++;
  if (l[12].y < l[10].y) count++;
  if (l[16].y < l[14].y) count++;
  if (l[20].y < l[18].y) count++;
  return count;
}

async function predictWebcam() {
  if (!webcamRunning) return;
  const results = handLandmarker.detectForVideo(video, performance.now());
  if (results.landmarks?.length) {
    const count = countFingers(results.landmarks[0]);
    if (count !== lastFingerCount) {
      lastFingerCount = count;
      result.textContent = count >= 1 && count <= 4 ? count : "–";
    }
  } else {
    result.textContent = "–";
  }
  requestAnimationFrame(predictWebcam);
}

document.getElementById("startCamera").addEventListener("click", enableCamera);
document.getElementById("startCamera").disabled = true;
createHandLandmarker();
</script>

<style>
*{box-sizing:border-box}
:root{
  --pink:#ff79b8; --pink2:#ffd3e9; --purple:#8e72e8;
  --purple2:#e9ddff; --text:#4d3b63; --white:#fffaff;
}
body{
  margin:0; min-height:100vh; font-family:Arial,"Noto Sans Thai",sans-serif;
  color:var(--text); overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%,#ffd8eb 0 8%,transparent 9%),
    radial-gradient(circle at 90% 15%,#e7d9ff 0 10%,transparent 11%),
    linear-gradient(135deg,#fff1f8,#f5efff 48%,#fff8fc);
}
body:before{
  content:"🐱   🐍   ♡   ✦   🐱   Python   ✨   🐍   ♡";
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:clamp(28px,5vw,58px); line-height:2.5; letter-spacing:18px;
  color:#b98be0; opacity:.10; transform:rotate(-12deg); pointer-events:none;
  z-index:-1;
}
.container{width:min(900px,92%); margin:auto; padding:34px 0 50px}
.header{text-align:center;margin-bottom:22px}
.logo{
  display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;
  background:#fff;border:2px solid #f2c9e4;box-shadow:0 8px 25px #c58bd42b;
  font-weight:800;color:#7551a9
}
.logo .python{font-size:25px}
h1{font-size:clamp(32px,6vw,52px);margin:15px 0 4px;letter-spacing:-1px;
  background:linear-gradient(90deg,#ef5fa8,#8d6de7);-webkit-background-clip:text;color:transparent}
.subtitle{font-size:17px;color:#7c6a8e}
.game{
  background:#ffffffdd;border:3px solid #f4d9ec;border-radius:30px;padding:24px;
  box-shadow:0 18px 50px #8b6aa529;backdrop-filter:blur(8px)
}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.badge{background:var(--purple2);padding:8px 13px;border-radius:999px;font-weight:700;color:#7255b1}
.cat-tip{background:#ffe2f0;padding:8px 13px;border-radius:999px;font-weight:700;color:#c24f8b}
.camera-box{
  position:relative;width:100%;aspect-ratio:16/9;max-width:720px;margin:auto;
  background:#302640;border-radius:23px;overflow:hidden;border:5px solid #fff;
  box-shadow:0 10px 30px #765b9228
}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.corner-cat{
  position:absolute;right:15px;bottom:12px;font-size:48px;
  filter:drop-shadow(0 4px 4px #0004);pointer-events:none
}
.status{margin:16px auto;text-align:center;color:#725d80;font-weight:700;min-height:24px}
button{
  display:block;margin:0 auto;border:0;border-radius:16px;padding:14px 28px;
  font-size:18px;font-weight:800;color:white;cursor:pointer;
  background:linear-gradient(135deg,#f06eaf,#8c70e8);
  box-shadow:0 8px 18px #9b6fbe45;transition:.2s
}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:not-allowed}
.result-box{
  margin:22px auto 4px;padding:18px;text-align:center;max-width:360px;
  background:linear-gradient(135deg,#fff0f7,#f1eaff);border:2px solid #ead7f4;border-radius:23px
}
.result-label{font-weight:800;color:#80658f}
.number{font-size:72px;line-height:1;margin:7px 0;font-weight:900;
  background:linear-gradient(180deg,#f05fa9,#8064dc);-webkit-background-clip:text;color:transparent}
.hint{text-align:center;margin-top:17px;color:#806d8e;font-size:14px}
.footer{text-align:center;margin-top:18px;color:#9a83a5;font-size:13px}
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div class="logo"><span class="python">🐍</span> Python Learning Game <span>🐱</span></div>
    <h1>Python Variable Game</h1>
    <div class="subtitle">เกมฝึกทักษะตัวแปร • การตั้งชื่อ • คำสงวน Python</div>
  </header>

  <section class="game">
    <div class="topbar">
      <div class="badge">✦ Hand Tracking</div>
      <div class="cat-tip">🐱 ผู้ช่วยแมวพร้อมแล้ว!</div>
    </div>

    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <div class="corner-cat">🐱</div>
    </div>

    <div id="status" class="status">กำลังโหลดระบบ...</div>
    <button id="startCamera" type="button">เปิดกล้องเพื่อเริ่ม</button>

    <div class="result-box" aria-live="polite">
      <div class="result-label">ตรวจพบนิ้ว</div>
      <div id="result" class="number">–</div>
      <div class="result-label">นิ้ว</div>
    </div>

    <div class="hint">ยกนิ้วชี้ • นิ้วกลาง • นิ้วนาง • นิ้วก้อย เพื่อทดสอบ 1–4 นิ้ว</div>
  </section>

  <div class="footer">🐍 Python × 🐱 Learning × Hand Tracking</div>
</main>
</body>
</html>
