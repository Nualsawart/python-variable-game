<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Variable Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#ffd6ec,#e6d7ff 55%,#cfe7ff);color:#4b3f55;min-height:100vh}
.container{max-width:1100px;margin:auto;padding:22px}
header{background:rgba(255,255,255,.88);border-radius:28px;padding:20px 24px;text-align:center;box-shadow:0 10px 30px #8d6aa322}
h1{margin:0;color:#7b4bb7;font-size:clamp(28px,5vw,44px)}
.subtitle{margin:8px 0 0;font-size:17px}
.game{margin-top:18px;background:rgba(255,255,255,.9);border-radius:28px;padding:22px;box-shadow:0 10px 30px #8d6aa322}
.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.badge{background:#f4e8ff;border-radius:999px;padding:9px 15px;font-weight:bold}
.progress{height:12px;background:#eee0f7;border-radius:99px;overflow:hidden;margin:16px 0 22px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ff8fc7,#9d7cff);transition:.3s}
.content{display:grid;grid-template-columns:1fr 360px;gap:20px}
@media(max-width:800px){.content{grid-template-columns:1fr}}
.question{font-size:24px;font-weight:bold;line-height:1.45;margin:8px 0 20px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.options{grid-template-columns:1fr}}
.option{border:3px solid #eadbf5;background:#fff;border-radius:18px;padding:16px;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
.option:hover{transform:translateY(-2px);border-color:#c19be8;background:#fbf6ff}
.option .num{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;background:#f0ddff;font-weight:bold;margin-right:8px}
.option.correct{border-color:#58b97a;background:#eafaf0}
.option.wrong{border-color:#ef7b92;background:#fff0f3}
.camera{background:#3e3547;border-radius:22px;padding:12px;color:white;text-align:center}
video{width:100%;border-radius:16px;display:block;background:#211d27;transform:scaleX(-1)}
.cameraStatus{font-size:14px;margin:9px 0 2px}
.feedback{min-height:54px;margin-top:18px;border-radius:16px;padding:13px 16px;background:#f7f1fb;line-height:1.5}
button{border:0;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer;background:#8b63c7;color:white}
button:hover{filter:brightness(1.05)}
.center{text-align:center}
.hidden{display:none}
.resultScore{font-size:52px;color:#7b4bb7;font-weight:bold}
.cat{font-size:64px}
.small{font-size:14px;color:#75697e}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="cat">🐱</div>
  <h1>Python Variable Game</h1>
  <div class="subtitle">เกมฝึกเรื่องตัวแปร การตั้งชื่อ และคำสงวน สำหรับนักเรียน ม.2</div>
</header>

<section class="game" id="game">
  <div class="top">
    <div class="badge" id="level">ด่าน 1: ตัวแปร</div>
    <div class="badge">ข้อ <span id="qnum">1</span> / 15</div>
    <div class="badge">คะแนน <span id="score">0</span></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="content">
    <div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback">เลือกคำตอบด้วยการคลิก หรือชูนิ้ว 1–4 หน้าน้องแมว</div>
    </div>
    <div class="camera">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="cameraStatus" id="cameraStatus">กำลังเตรียมกล้อง...</div>
    </div>
  </div>
</section>

<section class="game hidden center" id="result">
  <div class="cat">🐱</div>
  <h2>จบเกมแล้ว!</h2>
  <div class="resultScore"><span id="finalScore">0</span> คะแนน</div>
  <p id="summary"></p>
  <button onclick="restartGame()">เล่นอีกครั้ง</button>
</section>
</div>

<script type="module">
import {HandLandmarker, FilesetResolver}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const questions=[
{level:"ด่าน 1: ตัวแปร",q:"ข้อใดเป็นการสร้างตัวแปรในภาษา Python ได้ถูกต้อง?",o:["name = 'Fah'","name == 'Fah'","var name = 'Fah'","create name 'Fah'"],a:0,e:"Python สามารถสร้างตัวแปรโดยกำหนดค่า เช่น name = 'Fah'"},
{level:"ด่าน 1: ตัวแปร",q:"หลังคำสั่ง age = 14 ค่าในตัวแปร age คืออะไร?",o:["age","14","'age'","ไม่มีค่า"],a:1,e:"ตัวแปร age เก็บค่า 14"},
{level:"ด่าน 1: ตัวแปร",q:"คำสั่งใดใช้แสดงค่าของตัวแปร score?",o:["show(score)","print(score)","display = score","output(score)"],a:1,e:"print() ใช้แสดงข้อมูลออกทางหน้าจอ"},
{level:"ด่าน 1: ตัวแปร",q:"ถ้า x = 10 แล้ว x = 20 ค่าปัจจุบันของ x คือเท่าไร?",o:["10","20","30","0"],a:1,e:"ค่าที่กำหนดใหม่จะแทนค่าก่อนหน้า"},
{level:"ด่าน 1: ตัวแปร",q:"ข้อใดเหมาะสำหรับเก็บชื่อผู้เรียน?",o:["student_name = 'Mook'","student_name = 15","student_name = True","student_name = 3.14"],a:0,e:"ข้อความเหมาะกับตัวแปรที่เก็บชื่อ"},
{level:"ด่าน 2: การตั้งชื่อตัวแปร",q:"ข้อใดเป็นชื่อตัวแปรที่ถูกต้อง?",o:["2score","my score","my_score","class"],a:2,e:"ชื่อ my_score ใช้ตัวอักษรและ underscore ได้"},
{level:"ด่าน 2: การตั้งชื่อตัวแปร",q:"ข้อใดไม่สามารถใช้เป็นชื่อตัวแปรได้?",o:["student","score2","_name","2name"],a:3,e:"ชื่อตัวแปรห้ามขึ้นต้นด้วยตัวเลข"},
{level:"ด่าน 2: การตั้งชื่อตัวแปร",q:"ข้อใดอ่านง่ายและสื่อความหมายดีที่สุด?",o:["x","a1","student_age","zz"],a:2,e:"student_age สื่อความหมายชัดเจน"},
{level:"ด่าน 2: การตั้งชื่อตัวแปร",q:"ข้อใดเป็นการตั้งชื่อตัวแปรที่ถูกต้อง?",o:["first-name","first_name","first name","first$name"],a:1,e:"ใช้ underscore แทนช่องว่างหรือเครื่องหมายขีดกลาง"},
{level:"ด่าน 2: การตั้งชื่อตัวแปร",q:"Python แยกตัวพิมพ์เล็กและใหญ่หรือไม่?",o:["แยก","ไม่แยก","แยกเฉพาะตัวเลข","ไม่แน่นอน"],a:0,e:"Python เป็น case-sensitive เช่น Age และ age เป็นคนละชื่อ"},
{level:"ด่าน 3: คำสงวน",q:"ข้อใดเป็นคำสงวน (keyword) ของ Python?",o:["student","print","banana","score"],a:1,e:"print เป็นคำสงวน/keyword ที่ใช้ในภาษา Python"},
{level:"ด่าน 3: คำสงวน",q:"ข้อใดไม่ควรใช้เป็นชื่อตัวแปรเพราะเป็น keyword?",o:["total","price","if","amount"],a:2,e:"if เป็น keyword สำหรับเงื่อนไข"},
{level:"ด่าน 3: คำสงวน",q:"ข้อใดเป็น keyword ของ Python?",o:["for","looping","repeat","number"],a:0,e:"for เป็น keyword สำหรับการวนซ้ำ"},
{level:"ด่าน 3: คำสงวน",q:"ข้อใดเป็น keyword ของ Python?",o:["input","return","answer","value"],a:1,e:"return เป็น keyword ที่ใช้ส่งค่ากลับจากฟังก์ชัน"},
{level:"ด่าน 3: คำสงวน",q:"ข้อใดเป็น keyword ของ Python?",o:["classroom","class","student","school"],a:1,e:"class เป็น keyword สำหรับสร้างคลาส"}
];

let index=0,score=0,locked=false,handLandmarker=null,lastCount=0,stableFrames=0,lastAnswerTime=0;

const video=document.getElementById("webcam");
const qEl=document.getElementById("question");
const optionsEl=document.getElementById("options");
const feedback=document.getElementById("feedback");
const scoreEl=document.getElementById("score");
const qnum=document.getElementById("qnum");
const level=document.getElementById("level");
const bar=document.getElementById("bar");
const cameraStatus=document.getElementById("cameraStatus");

function renderQuestion(){
 const x=questions[index];
 qnum.textContent=index+1; level.textContent=x.level; qEl.textContent=x.q;
 bar.style.width=((index)/questions.length*100)+"%";
 feedback.textContent="เลือกคำตอบด้วยการคลิก หรือชูนิ้ว 1–4";
 optionsEl.innerHTML="";
 x.o.forEach((text,i)=>{
   const b=document.createElement("button");
   b.className="option";
   b.innerHTML=`<span class="num">${i+1}</span>${text}`;
   b.onclick=()=>answer(i);
   optionsEl.appendChild(b);
 });
 locked=false;
}
function answer(choice){
 if(locked)return;
 locked=true;
 const x=questions[index];
 const buttons=[...optionsEl.children];
 buttons[x.a].classList.add("correct");
 if(choice===x.a){
   score+=10; scoreEl.textContent=score;
   feedback.innerHTML="<b>ถูกต้อง!</b> +10 คะแนน<br>"+x.e;
 }else{
   buttons[choice].classList.add("wrong");
   feedback.innerHTML="<b>ยังไม่ถูก</b><br>"+x.e;
 }
 setTimeout(()=>{
   index++;
   if(index<questions.length) renderQuestion();
   else finish();
 },1200);
}
function finish(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score;
 document.getElementById("summary").textContent=`ได้ ${score/10} จาก ${questions.length} ข้อ`;
 bar.style.width="100%";
}
window.restartGame=()=>{
 index=0;score=0;scoreEl.textContent=0;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 renderQuestion();
};

async function setupHandTracking(){
 try{
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
  const baseOptions={
   modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  };
  try{
   handLandmarker=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{...baseOptions,delegate:"GPU"},
    runningMode:"VIDEO",numHands:1
   });
  }catch(gpuError){
   console.warn("GPU unavailable, switching to CPU",gpuError);
   handLandmarker=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{...baseOptions,delegate:"CPU"},
    runningMode:"VIDEO",numHands:1
   });
  }
  cameraStatus.textContent="Hand Tracking พร้อม — กำลังเปิดกล้อง...";
  startCamera();
 }catch(err){
  console.error(err);
  cameraStatus.textContent="โหลด Hand Tracking ไม่สำเร็จ — ใช้เมาส์ตอบได้";
 }
}
async function startCamera(){
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
   throw new Error("Camera API unavailable");
  }
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},
   audio:false
  });
  video.srcObject=stream;
  video.onloadeddata=()=>{
   cameraStatus.textContent="กล้องพร้อม — ชู 1–4 นิ้วเพื่อเลือกคำตอบ";
   requestAnimationFrame(predict);
  };
 }catch(err){
  console.error("Camera error:",err);
  cameraStatus.textContent="เปิดกล้องไม่ได้ — สามารถใช้เมาส์ตอบได้";
 }
}
function fingerCount(lm){
 if(!lm)return 0;
 let count=0;
 const tips=[8,12,16,20], pips=[6,10,14,18];
 for(let i=0;i<4;i++){
  if(lm[tips[i]].y < lm[pips[i]].y) count++;
 }
 return count;
}
function predict(){
 if(!handLandmarker||video.readyState<2){requestAnimationFrame(predict);return}
 const now=performance.now();
 const result=handLandmarker.detectForVideo(video,now);
 const count=result.landmarks?.length?fingerCount(result.landmarks[0]):0;
 if(count===lastCount && count>0) stableFrames++; else {lastCount=count;stableFrames=0}
 if(stableFrames>=7 && count>=1 && count<=4 && now-lastAnswerTime>1300 && !locked){
   answer(count-1); lastAnswerTime=now; stableFrames=0;
 }
 requestAnimationFrame(predict);
}
renderQuestion();
setupHandTracking();
setTimeout(()=>{
 if(cameraStatus.textContent.includes("กำลังเตรียม") || cameraStatus.textContent.includes("กำลังเปิด")){
  cameraStatus.textContent="กำลังโหลดนานเกินไป — รีเฟรชหน้าเว็บอีกครั้ง หรือใช้เมาส์ตอบได้";
 }
},15000);
</script>
</body>
</html>
